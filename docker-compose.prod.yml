# Production stack for a single Linux VPS.
#   ./infrastructure/scripts/deploy.sh
# Only the reverse proxy publishes ports (80/443). PostgreSQL and Redis live on an internal
# network with no published ports and no internet egress.
name: vimora

x-backend: &backend
  image: vimora-backend:${VIMORA_VERSION:-latest}
  build: ./backend
  env_file: .env
  environment:
    APP_ENV: production
    DATABASE_URL: postgresql+psycopg://vimora:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/vimora
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    LOCAL_STORAGE_PATH: /data/storage
  volumes: [storage:/data/storage]
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  networks: [internal, egress]
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  reverse-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      VIMORA_DOMAIN: ${VIMORA_DOMAIN:?set VIMORA_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [frontend, backend-api]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  frontend:
    image: vimora-frontend:${VIMORA_VERSION:-latest}
    build: { context: ./frontend, args: { NEXT_PUBLIC_APP_URL: "${APP_URL}" } }
    environment: { INTERNAL_API_URL: "http://backend-api:8000", NEXT_PUBLIC_APP_URL: "${APP_URL}" }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [edge, internal]
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  backend-api:
    <<: *backend
    networks: [edge, internal, egress]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles: [ops]

  background-worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "default,ai", "-c", "3", "--loglevel=INFO", "--max-tasks-per-child", "200"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3

  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_DB: vimora, POSTGRES_USER: vimora, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    shm_size: 256mb
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vimora -d vimora"], interval: 10s, retries: 10 }
    logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    networks: [internal]
    healthcheck: { test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"], interval: 10s, retries: 10 }
    environment: { REDIS_PASSWORD: "${REDIS_PASSWORD}" }

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_GPG_RECIPIENT: ${BACKUP_GPG_RECIPIENT:-}
    volumes:
      - ./infrastructure/scripts/backup-loop.sh:/backup-loop.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh", "/backup-loop.sh"]
    networks: [internal]
    depends_on: { postgres: { condition: service_healthy } }

networks:
  edge: {}
  internal: { internal: true }   # no route to the internet
  egress: {}                     # API/worker outbound calls (payments, Telegram, AI, SMTP)

volumes: { pgdata: {}, redisdata: {}, storage: {}, caddy_data: {}, caddy_config: {} }

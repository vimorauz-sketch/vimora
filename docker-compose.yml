# Local development stack. Ports are bound to 127.0.0.1 only.
#   docker compose up -d --build
#   docker compose exec backend-api alembic upgrade head
name: vimora-dev
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://vimora:${POSTGRES_PASSWORD:-vimora_dev}@postgres:5432/vimora
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_PATH: /data/storage
    EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
    DEV_MAILBOX_PATH: /data/storage/dev-mailbox.log
  volumes: [storage:/data/storage]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: vimora, POSTGRES_USER: vimora, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-vimora_dev}" }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5433:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U vimora -d vimora"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }
  backend-api:
    <<: *backend
    ports: ["127.0.0.1:8001:8000"]
  background-worker:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "default,ai", "-c", "2", "--loglevel=INFO"]
    healthcheck: { disable: true }
  scheduler:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck: { disable: true }
  frontend:
    build: { context: ./frontend, args: { NEXT_PUBLIC_APP_URL: "http://localhost:3001" } }
    environment: { INTERNAL_API_URL: "http://backend-api:8000", NEXT_PUBLIC_APP_URL: "http://localhost:3001" }
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [backend-api]

volumes: { pgdata: {}, redisdata: {}, storage: {} }
